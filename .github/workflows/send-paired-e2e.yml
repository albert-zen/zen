name: Same-runner recall integration send A/B
on:
  push:
    branches: [diagnostic/send-latency-e2e-20261102]
    paths:
      - .github/workflows/send-paired-e2e.yml
      - apps/zenx/scripts/capture-send-paired.cjs
      - apps/zenx/scripts/launch-send-paired.mjs
permissions:
  contents: read
jobs:
  paired-native-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c7ebff5960493bf3b1ae47ffaa78e9c24202440
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: 400bac27dd80c0238360dd2632c5c41972566d4b
          persist-credentials: false
          path: combined
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy identical passive drivers, leaving product tracked files unchanged
        run: |
          for source in baseline combined; do
            cp diagnostic/apps/zenx/scripts/capture-send-feedback.cjs "$source/apps/zenx/scripts/"
            cp diagnostic/apps/zenx/scripts/launch-send-paired.mjs "$source/apps/zenx/scripts/launch-send-feedback.mjs"
            cp diagnostic/apps/zenx/scripts/long-thread-domain-seed.mjs "$source/apps/zenx/scripts/"
          done
      - name: Build exact baseline once
        working-directory: baseline
        timeout-minutes: 10
        run: |
          npm ci
          npm run build
          npm run build --workspace @zen/zenx
      - name: Build exact combined candidate once
        working-directory: combined
        timeout-minutes: 10
        run: |
          npm ci
          npm run build
          npm run build --workspace @zen/zenx
      - name: Native A1 B1, all three messages per fresh isolated profile
        timeout-minutes: 24
        run: |
          failed=0
          for case in A1 B1; do
            case "$case" in A*) source=baseline ;; B*) source=combined ;; esac
            echo "PAIRED_CASE_BEGIN $case $source"
            set +e
            (cd "$source" && node apps/zenx/scripts/launch-send-feedback.mjs "../results/$case" 5000 "$source" "$case")
            status=$?
            set -e
            printf '%s\n' "$status" > "results/$case/launcher-exit-code.txt"
            if [ "$status" -ne 0 ]; then failed=1; fi
            echo "PAIRED_CASE_END $case $source"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-send-recall-same-runner-ab-5000
          path: results
          if-no-files-found: error
