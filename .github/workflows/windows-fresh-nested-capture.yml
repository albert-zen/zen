name: Windows nested capture history controls
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-fresh-nested-capture.yml
      - apps/zenx/test/browser-fresh-nested-capture.test.mjs
permissions:
  contents: read
jobs:
  fresh-nested-capture:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install a pinned headed Chromium fixture
        shell: pwsh
        run: |
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP "zenx-browser-fixture"
          npm install --prefix $fixtureDirectory --no-package-lock --no-audit --no-fund playwright@1.63.0
          if ($LASTEXITCODE -ne 0) { throw "Could not install the pinned browser fixture" }
          node (Join-Path $fixtureDirectory "node_modules/playwright/cli.js") install chromium
          if ($LASTEXITCODE -ne 0) { throw "Could not download the pinned Chromium build" }
          $env:ZENX_CI_PLAYWRIGHT = Join-Path $fixtureDirectory "node_modules/playwright"
          $browserExecutable = node -e "process.stdout.write(require(process.env.ZENX_CI_PLAYWRIGHT).chromium.executablePath())"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $browserExecutable)) { throw "Chromium executable is missing" }
          # The unpacked browser needs AppContainer/LPAC read-execute access for
          # its sandboxed renderer and network processes (no sandbox bypass).
          $browserDirectory = Split-Path -Parent $browserExecutable
          icacls $browserDirectory /grant '*S-1-15-2-1:(OI)(CI)(RX)' '*S-1-15-2-2:(OI)(CI)(RX)' /T /Q
          if ($LASTEXITCODE -ne 0) { throw "Could not grant Chromium sandbox read-execute access" }
          "ZENX_USER_BROWSER_EXECUTABLE=$browserExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate fresh diagnostic and screenshot transport semantics
        run: node --import tsx --test apps/zenx/test/browser-fresh-nested-capture.test.mjs apps/zenx/test/browser-fixture-cdp-timeout.test.mjs
      - name: Compare three predeclared inactive scenes without input or retry
        timeout-minutes: 5
        shell: pwsh
        env:
          ZENX_NESTED_CAPTURE_MATRIX_ONLY: "1"
          ZENX_REQUIRE_OS_INPUT: "1"
          ZENX_PARALLEL_INPUT_ARTIFACT_DIR: ${{ runner.temp }}/zenx-fresh-nested-capture
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZENX_PARALLEL_INPUT_ARTIFACT_DIR | Out-Null
          $log = Join-Path $env:ZENX_PARALLEL_INPUT_ARTIFACT_DIR "fresh-nested-capture.log"
          npm --workspace apps/zenx run smoke:browser-parallel-input 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-fresh-nested-capture
          path: ${{ runner.temp }}/zenx-fresh-nested-capture
          if-no-files-found: warn
