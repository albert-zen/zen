name: Same-source Send focus handoff A/B (verified frames)
on:
  push:
    branches: [diagnostic/send-latency-e2e-20261102]
    paths:
      - .github/workflows/send-focus-paired-e2e.yml
      - apps/zenx/scripts/capture-send-feedback-verified-frame.cjs
      - apps/zenx/scripts/launch-send-focus-paired.mjs
      - apps/zenx/scripts/test-send-feedback-observation.cjs
permissions:
  contents: read
jobs:
  paired-native-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 363c45cb2ebe9eb63313398b5a06b7a6ffa25d50
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: 3d8f9cd24109f7fbf7abaca32c1bae4ade130f80
          persist-credentials: false
          path: focus
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy identical passive drivers, leaving product tracked files unchanged
        run: |
          for source in baseline focus; do
            cp diagnostic/apps/zenx/scripts/capture-send-feedback-verified-frame.cjs "$source/apps/zenx/scripts/capture-send-feedback.cjs"
            cp diagnostic/apps/zenx/scripts/launch-send-focus-paired.mjs "$source/apps/zenx/scripts/launch-send-feedback.mjs"
            cp diagnostic/apps/zenx/scripts/long-thread-domain-seed.mjs "$source/apps/zenx/scripts/"
          done
      - name: Build exact baseline once
        working-directory: baseline
        timeout-minutes: 10
        run: |
          npm ci
          npm run build
          npm run build --workspace @zen/zenx
      - name: Build exact focus candidate once
        working-directory: focus
        timeout-minutes: 10
        run: |
          npm ci
          npm run build
          npm run build --workspace @zen/zenx
      - name: Verify observer timing and replacement identity contracts (synthetic, not native timing)
        working-directory: baseline
        run: node --test ../diagnostic/apps/zenx/scripts/test-send-feedback-observation.cjs
      - name: Native A1 B1, all three messages per fresh isolated profile
        timeout-minutes: 24
        run: |
          failed=0
          for case in A1 B1; do
            case "$case" in A*) source=baseline ;; B*) source=focus ;; esac
            echo "PAIRED_CASE_BEGIN $case $source"
            set +e
            (cd "$source" && node apps/zenx/scripts/launch-send-feedback.mjs "../results/$case" 5000 "$source" "$case")
            status=$?
            set -e
            printf '%s\n' "$status" > "results/$case/launcher-exit-code.txt"
            if [ "$status" -ne 0 ]; then failed=1; fi
            echo "PAIRED_CASE_END $case $source"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-send-focus-same-source-ab-5000
          path: |
            results/*/full-app-*.json
            results/*/independent-storage-verification.json
            results/*/messages-*.png
            results/*/launcher-exit-code.txt
          if-no-files-found: error
