name: Bounded native macOS remaining layout diagnostics
on:
  push:
    branches: ["diagnostic/pane-expansion-comparison-20261101"]
    paths:
      - .github/workflows/full-app-expansion.yml
      - apps/zenx/scripts/launch-full-app-expansion.mjs
      - apps/zenx/scripts/capture-full-app-expansion.cjs
permissions:
  contents: read
jobs:
  full-app:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: current
            source: e15f8c086d9cd42bbd04dd02fc2b2cfcd6646324
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked dependencies and Electron
        working-directory: source
        timeout-minutes: 5
        run: npm ci
      - name: Build unmodified production main, preload, renderer and bundled plugins
        working-directory: source
        timeout-minutes: 7
        run: |
          npm run build --workspace @zen/zenx
          cp ../diagnostic/apps/zenx/scripts/{launch-full-app-expansion.mjs,capture-full-app-expansion.cjs} apps/zenx/scripts/
          git diff --exit-code -- apps/zenx/src apps/zenx/electron.vite.config.ts
      - name: Own isolated real App with fake Host; no Turn or external credentials
        working-directory: source
        timeout-minutes: 4
        run: |
          node apps/zenx/scripts/launch-full-app-expansion.mjs '${{ runner.temp }}/full-app-expansion' '${{ matrix.version }}'
      - name: Retain only synthetic screenshots and explicitly selected measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-app-expansion-macos-${{ matrix.version }}-${{ matrix.source }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/full-app-expansion/*.png
            ${{ runner.temp }}/full-app-expansion/full-app-measurements.json
            ${{ runner.temp }}/full-app-expansion/full-app-source.json
            ${{ runner.temp }}/full-app-expansion/full-app-lifecycle.json
