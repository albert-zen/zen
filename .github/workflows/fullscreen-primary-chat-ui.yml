name: Fullscreen primary chat Chromium layout acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fullscreen-primary-chat-ui.yml
      - apps/zenx/scripts/*fullscreen-primary-chat-preview.*
      - apps/zenx/scripts/preview-browser*.mjs
      - apps/zenx/src/renderer/**
      - packages/zenx-rooms-plugin/**
      - package.json
      - package-lock.json
      - apps/zenx/package.json
permissions:
  contents: read
concurrency:
  group: fullscreen-primary-chat-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-synthetic-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore verified desktop archives
        timeout-minutes: 5
        id: desktop-archives
        uses: ./.github/actions/desktop-archive-cache
        with:
          phase: restore
      - run: npm ci
      - run: npm run build --workspace @zenx/plugin-sdk
      - name: Build exact checked-out production components with synthetic ports
        run: node apps/zenx/scripts/build-fullscreen-primary-chat-preview.mjs "${{ runner.temp }}/fullscreen-primary-chat"
      - name: Verify real Chromium geometry and repeated browser to chat switching
        run: node apps/zenx/scripts/capture-fullscreen-primary-chat-preview.mjs "${{ runner.temp }}/fullscreen-primary-chat"
      - name: Upload synthetic renderer evidence (not native webview or Host acceptance)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullscreen-primary-chat-${{ github.sha }}
          path: ${{ runner.temp }}/fullscreen-primary-chat
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified desktop archives
        timeout-minutes: 5
        if: ${{ always() && steps.desktop-archives.outcome == 'success' }}
        uses: ./.github/actions/desktop-archive-cache
        with:
          phase: save
          electron-cache-hit: ${{ steps.desktop-archives.outputs.electron-cache-hit }}
          rtk-cache-hit: ${{ steps.desktop-archives.outputs.rtk-cache-hit }}
