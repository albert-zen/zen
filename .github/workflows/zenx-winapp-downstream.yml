name: ZenX WinApp downstream native review

on:
  push:
    branches:
      - diagnostic/winapp-patched-closure-20261104
    paths:
      - .github/workflows/zenx-winapp-downstream.yml
      - scripts/prepare-zenx-winapp-security-closure.mjs
      - apps/zenx/test/winapp-security-closure.test.mjs
  workflow_dispatch:
    inputs:
      prepare_security_closure:
        description: Prepare the reviewed .NET 10.0.14 security closure only
        type: boolean
        default: false
  # Pull requests build once in the Windows packaged-provider CI job, which
  # passes this same-run immutable input to both smoke and portable packaging.

permissions:
  contents: read

concurrency:
  group: winapp-downstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.prepare_security_closure }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/winappCli
          ref: c8ada4a403c43b96780b87abc454cba51f649c60 # v0.3.1
          path: .native-sources/winappcli
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/zenx-dotnet-candidate
        with:
          dotnet-version: 10.0.401
      - name: Validate the downstream build contract
        run: node --test apps/zenx/test/winapp-downstream-build.test.mjs apps/zenx/test/winapp-downstream-assembly.test.mjs apps/zenx/test/winapp-downstream-symbols.test.mjs
      - name: Build and probe the isolated downstream candidate
        run: node scripts/build-zenx-winapp-downstream.mjs --source .native-sources/winappcli --output "${{ runner.temp }}/zenx-winapp-downstream" --symbols-output "${{ runner.temp }}/zenx-winapp-symbols"
      - name: Retain candidate and provenance for review
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenx-winapp-downstream-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-winapp-downstream
          if-no-files-found: warn
          retention-days: 14
      - name: Retain detached native debug symbols as same-run build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenx-winapp-debug-symbols-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zenx-winapp-symbols/winapp.pdb
            ${{ runner.temp }}/zenx-winapp-symbols/symbols-provenance.json
          if-no-files-found: warn
          retention-days: 14

  prepare-security-closure:
    if: ${{ github.event_name == 'push' || inputs.prepare_security_closure }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/winappCli
          ref: c8ada4a403c43b96780b87abc454cba51f649c60 # v0.3.1
          path: .native-sources/winappcli
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Prefer the exact preinstalled patched SDK
        id: existing-sdk
        shell: pwsh
        run: |
          $sdks = @(& dotnet --list-sdks)
          if ($LASTEXITCODE -ne 0) { throw "Cannot inventory installed SDKs" }
          $sdks | ForEach-Object { Write-Host $_ }
          $matchingSdks = @($sdks | Where-Object { $_ -match '^10\.0\.403 \[(.+)\]$' })
          if ($matchingSdks.Count -gt 1) { throw "Ambiguous exact SDK installation" }
          if ($matchingSdks.Count -eq 1) {
            $sdkRoot = Split-Path ([regex]::Match($matchingSdks[0], '^10\.0\.403 \[(.+)\]$').Groups[1].Value) -Parent
            "DOTNET_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $sdkRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Install official patched SDK only when absent
        if: ${{ steps.existing-sdk.outputs.found != 'true' }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/zenx-dotnet-security-closure
        with:
          dotnet-version: 10.0.403
      - name: Validate isolated preparation contract
        run: node --test apps/zenx/test/winapp-security-closure.test.mjs
      - name: Generate and freeze the actual public NuGet closure
        run: node scripts/prepare-zenx-winapp-security-closure.mjs --source .native-sources/winappcli --work "${{ runner.temp }}/zenx-winapp-security-closure"
      - name: Retain only generated lock and bounded receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenx-winapp-security-closure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zenx-winapp-security-closure/artifact/packages.lock.json
            ${{ runner.temp }}/zenx-winapp-security-closure/artifact/security-closure-receipt.json
          if-no-files-found: error
          retention-days: 14
