name: ZenX WinApp downstream build experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .gitattributes
      - .github/workflows/zenx-winapp-downstream.yml
      - vendor/winapp-0.3.1/**
      - scripts/build-zenx-winapp-downstream.mjs
      - apps/zenx/test/winapp-downstream-build.test.mjs

permissions:
  contents: read

concurrency:
  group: winapp-downstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/winappCli
          ref: c8ada4a403c43b96780b87abc454cba51f649c60 # v0.3.1
          path: .native-sources/winappcli
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/zenx-dotnet-candidate
        with:
          dotnet-version: 10.0.401
      - name: Validate the downstream build contract
        run: node --test apps/zenx/test/winapp-downstream-build.test.mjs
      - name: Build and probe the isolated downstream candidate
        run: node scripts/build-zenx-winapp-downstream.mjs --source .native-sources/winappcli --output "${{ runner.temp }}/zenx-winapp-downstream"
      - name: Retain candidate and provenance for review
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenx-winapp-downstream-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-winapp-downstream
          if-no-files-found: warn
          retention-days: 14
