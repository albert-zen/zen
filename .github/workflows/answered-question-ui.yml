name: Answered question bubble acceptance
on:
  pull_request:
    paths:
      - .github/workflows/answered-question-ui.yml
      - apps/zenx/src/renderer/src/AnsweredQuestionBubble.tsx
      - apps/zenx/src/renderer/src/answered-question-presentation.ts
      - apps/zenx/src/renderer/src/answered-question.css
      - apps/zenx/src/renderer/src/ThreadView.tsx
      - apps/zenx/src/renderer/src/i18n/shell.ts
      - apps/zenx/test/answered-question*.test.ts
      - apps/zenx/test/fixtures/answered-question-data.ts
      - apps/zenx/test/fixtures/answered-question-card-visual.tsx
      - apps/zenx/src/renderer/src/UserQuestionCards.tsx
      - apps/zenx/src/renderer/src/RoomQuestionCards.tsx
      - apps/zenx/test/fixtures/message-quote-visual.tsx
      - apps/zenx/scripts/capture-answered-question-preview.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: answered-question-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  answered-question:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install CJK fonts for readable synthetic screenshots
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npm run build --workspace @zenx/plugin-sdk
      - name: Native answer provenance and real renderer interactions
        run: node --import tsx --test apps/zenx/test/answered-question-presentation.test.ts apps/zenx/test/answered-question-interaction.test.ts apps/zenx/test/turn-canonical-presentation.test.ts
      - name: Build production renderer with synthetic question history
        run: node apps/zenx/scripts/build-quote-preview.mjs "${{ runner.temp }}/answered-question"
      - name: Hover, click, keyboard, navigation and historical fallback
        run: node apps/zenx/scripts/capture-answered-question-preview.mjs "${{ runner.temp }}/answered-question"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answered-question-${{ github.sha }}
          path: |
            ${{ runner.temp }}/answered-question/*.png
            ${{ runner.temp }}/answered-question/*evidence.json
            ${{ runner.temp }}/answered-question/*lifecycle*.json
          if-no-files-found: warn
          retention-days: 14
