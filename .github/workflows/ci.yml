name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-cli-imzen:
    name: Core, CLI, and IMZen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Authenticate the private IM Agent SDK dependency
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.IM_AGENT_SDK_DEPLOY_KEY }}
      - name: Route the pinned SDK dependency through its read-only deploy key
        run: >-
          git config --global
          url."git@github.com:albert-zen/im-agent-sdk.git".insteadOf
          "https://github.com/albert-zen/im-agent-sdk.git"
      - run: npm ci
      - run: npm run check

  zenx:
    name: ZenX typecheck, tests, and build
    runs-on: ubuntu-latest
    # Existing accepted workload takes about 19 minutes; add only the bounded
    # six-minute normal/expanded tab acceptance step without reducing coverage.
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        id: zenx-dependencies
      - name: Test fail-closed CJK prerequisite contracts (synthetic data)
        run: node --test apps/zenx/test/cjk-font-prerequisite.test.mjs
      - name: Resolve CJK font from authenticated Ubuntu package indexes
        id: cjk-package
        timeout-minutes: 3
        run: node apps/zenx/scripts/prepare-cjk-fonts.mjs resolve "${{ runner.temp }}/zenx-cjk-fonts"
      - name: Restore exact verified CJK package archive
        id: cjk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cjk-package.outputs.deb-path }}
          key: ${{ steps.cjk-package.outputs.cache-key }}
      - name: Install and verify CJK fonts before all synthetic UI capture
        id: zenx-fonts
        timeout-minutes: 5
        run: node apps/zenx/scripts/prepare-cjk-fonts.mjs install "${{ runner.temp }}/zenx-cjk-fonts"
      - name: Cache only the verified CJK package archive
        if: ${{ steps.zenx-fonts.outcome == 'success' && steps.cjk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cjk-package.outputs.deb-path }}
          key: ${{ steps.cjk-package.outputs.cache-key }}
      - name: Capture send preparation feedback (synthetic production components)
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' && steps.zenx-fonts.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          node apps/zenx/scripts/build-send-preparation-preview.mjs "${{ runner.temp }}/zenx-send-preparation"
          node apps/zenx/scripts/capture-send-preparation-preview.mjs "${{ runner.temp }}/zenx-send-preparation"
      - name: Retain send preparation screenshots and elapsed-time evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-send-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-send-preparation
          if-no-files-found: warn
          retention-days: 14
      - name: Capture titlebar leading-safe-area matrix (synthetic production components)
        run: |
          node apps/zenx/scripts/build-titlebar-safe-area-preview.mjs "${{ runner.temp }}/zenx-titlebar-safe-area"
          node apps/zenx/scripts/capture-titlebar-safe-area-preview.mjs "${{ runner.temp }}/zenx-titlebar-safe-area"
      - name: Retain titlebar safe-area matrix and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-titlebar-safe-area-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-titlebar-safe-area
          if-no-files-found: warn
          retention-days: 14
      - name: Verify workspace tab overflow on production components
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' && steps.zenx-fonts.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          node apps/zenx/scripts/build-titlebar-safe-area-preview.mjs "${{ runner.temp }}/zenx-tab-overflow"
          node apps/zenx/scripts/capture-workspace-tab-overflow.mjs "${{ runner.temp }}/zenx-tab-overflow"
      - name: Retain synthetic workspace tab overflow evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-tab-overflow-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-tab-overflow
          if-no-files-found: warn
          retention-days: 14
      - name: Capture foreground activity renderer (synthetic, not native OS acceptance)
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' && steps.zenx-fonts.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          mkdir -p "${{ runner.temp }}/zenx-foreground-activity"
          node apps/zenx/scripts/preview-foreground-activity.mjs "${{ runner.temp }}/zenx-foreground-activity/foreground-activity.html" > "${{ runner.temp }}/zenx-foreground-activity/source.json"
          node apps/zenx/scripts/capture-foreground-activity-preview.mjs "${{ runner.temp }}/zenx-foreground-activity"
      - name: Retain foreground activity synthetic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-foreground-activity-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-foreground-activity
          if-no-files-found: warn
          retention-days: 14
      - name: Capture compaction capsules (production components, synthetic records)
        run: |
          node apps/zenx/scripts/build-compaction-preview.mjs "${{ runner.temp }}/zenx-compaction"
          node apps/zenx/scripts/capture-compaction-preview.mjs "${{ runner.temp }}/zenx-compaction"
      - name: Retain compaction capsule synthetic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-compaction-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-compaction
          if-no-files-found: warn
          retention-days: 14
      - name: Capture reference bubble width diagnostic (production components, synthetic identity)
        run: |
          node apps/zenx/scripts/build-reference-width-preview.mjs "${{ runner.temp }}/zenx-reference-width"
          node apps/zenx/scripts/capture-reference-width-preview.mjs "${{ runner.temp }}/zenx-reference-width"
      - name: Retain reference width measurements and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-reference-width-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-reference-width
          if-no-files-found: warn
          retention-days: 14
      - name: Build and capture approved UI previews
        run: |
          node apps/zenx/scripts/build-approved-ui-preview.mjs "${{ runner.temp }}/zenx-approved-ui-preview"
          ZENX_PREVIEW_DESKTOP_INPUT=1 node apps/zenx/scripts/capture-approved-ui-preview.mjs "${{ runner.temp }}/zenx-approved-ui-preview"
      - name: Retain approved synthetic UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-approved-ui-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-approved-ui-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Build and capture synthetic process-style preview
        run: |
          node apps/zenx/scripts/build-process-style-preview.mjs "${{ runner.temp }}/zenx-process-style-preview"
          node apps/zenx/scripts/capture-process-style-preview.mjs "${{ runner.temp }}/zenx-process-style-preview"
          mkdir -p "${{ runner.temp }}/zenx-process-style-preview/transcript"
          cp "${{ runner.temp }}/zenx-process-style-preview/process-style-frame.html" "${{ runner.temp }}/zenx-process-style-preview/transcript/"
          node apps/zenx/scripts/capture-transcript-process-preview.mjs "${{ runner.temp }}/zenx-process-style-preview/transcript"
      - name: Retain synthetic process-style visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-process-style-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-process-style-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Build and capture synthetic quote draft and sent states
        run: |
          node --import tsx apps/zenx/scripts/capture-inline-reference-context.mjs "${{ runner.temp }}/zenx-quote-preview/reference-context-v3"
          node apps/zenx/scripts/build-quote-preview.mjs "${{ runner.temp }}/zenx-quote-preview"
          node apps/zenx/scripts/capture-quote-preview.mjs "${{ runner.temp }}/zenx-quote-preview"
          ZENX_PREVIEW_DESKTOP_INPUT=1 node apps/zenx/scripts/capture-turn-selection-preview.mjs "${{ runner.temp }}/zenx-quote-preview"
      - name: Retain synthetic quote visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-quote-preview-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-quote-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Build and capture What's New actual-component preview
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' && steps.zenx-fonts.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          node apps/zenx/scripts/build-whats-new-preview.mjs "${{ runner.temp }}/zenx-whats-new-preview"
          node apps/zenx/scripts/capture-whats-new-preview.mjs "${{ runner.temp }}/zenx-whats-new-preview"
      - name: Retain What's New synthetic UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-whats-new-ui-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-whats-new-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Build and capture trigger message bubble evidence
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' && steps.zenx-fonts.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          npx tsc -p apps/zenx/tsconfig.trigger-message-preview.json --noEmit
          node apps/zenx/scripts/build-trigger-message-preview.mjs "${{ runner.temp }}/zenx-trigger-message-preview"
          node apps/zenx/scripts/capture-trigger-message-preview.mjs "${{ runner.temp }}/zenx-trigger-message-preview"
      - name: Retain trigger message synthetic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-trigger-message-ui-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-trigger-message-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Build and capture file sidebar actual-component preview
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' && steps.zenx-fonts.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          node apps/zenx/scripts/build-file-sidebar-preview.mjs "${{ runner.temp }}/zenx-file-sidebar-preview"
          node apps/zenx/scripts/capture-file-sidebar-preview.mjs "${{ runner.temp }}/zenx-file-sidebar-preview"
      - name: Retain file sidebar synthetic UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-file-sidebar-ui-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-file-sidebar-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Build and capture thread and Room sidebar state preview
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' && steps.zenx-fonts.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          node apps/zenx/scripts/build-sidebar-state-preview.mjs "${{ runner.temp }}/zenx-sidebar-state-preview"
          node apps/zenx/scripts/capture-sidebar-state-preview.mjs "${{ runner.temp }}/zenx-sidebar-state-preview"
      - name: Retain sidebar state synthetic UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-sidebar-state-ui-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-sidebar-state-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Capture read-only Settings audit evidence
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' && steps.zenx-fonts.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          node apps/zenx/scripts/build-settings-audit-preview.mjs "${{ runner.temp }}/zenx-settings-audit"
          node apps/zenx/scripts/capture-settings-audit-preview.mjs "${{ runner.temp }}/zenx-settings-audit"
      - name: Retain Settings audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-settings-audit-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-settings-audit
          if-no-files-found: warn
          retention-days: 14
      - name: Capture synthetic trigger management UI
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' && steps.zenx-fonts.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          git fetch --no-tags origin 98caf2f44ec697bd705909eb970036ce615ca664
          npx tsc -p apps/zenx/tsconfig.trigger-preview.json --noEmit
          node apps/zenx/scripts/build-trigger-management-preview.mjs "${{ runner.temp }}/zenx-trigger-management/before" --baseline
          node apps/zenx/scripts/capture-trigger-management-preview.mjs "${{ runner.temp }}/zenx-trigger-management/before"
          node apps/zenx/scripts/build-trigger-management-preview.mjs "${{ runner.temp }}/zenx-trigger-management/after"
          node apps/zenx/scripts/capture-trigger-management-preview.mjs "${{ runner.temp }}/zenx-trigger-management/after"
      - name: Retain synthetic trigger management UI
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-trigger-management-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-trigger-management
          if-no-files-found: warn
          retention-days: 14
      - name: Check ZenX with bounded execution-order evidence
        if: ${{ !cancelled() && steps.zenx-dependencies.outcome == 'success' }}
        env:
          ZENX_TEST_EXECUTION_TRACE_FILE: ${{ runner.temp }}/zenx-test-execution.ndjson
        run: npm --workspace apps/zenx run check:observed
      - name: Retain partial ZenX execution-order evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zenx-test-execution-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-test-execution.ndjson
          if-no-files-found: warn
          retention-days: 14

  zenx-capability-smoke:
    name: ZenX packaged capability smoke
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache verified provider archives
        uses: actions/cache@v4
        with:
          # Only immutable downloads; assembly still verifies every digest.
          # Never restore staging output or another runner's transaction locks.
          path: apps/zenx/.packaged/cache/artifacts/sha256/[0-9a-f]*
          key: zenx-provider-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/zenx/resources/providers/provider-lock.json') }}
      - run: npm ci
      - name: Exercise shared Shell PTY on macOS
        timeout-minutes: 1
        env:
          ZENX_SHELL_TEST_DIAGNOSTICS: "1"
        run: node --import tsx --test --test-timeout=30000 apps/zenx/test/shell-panel-service.test.ts
      - name: Exercise shell lifecycle observations on macOS
        run: npm run build && node --test dist/test/shell-lifecycle.test.js
      - name: Verify macOS input construction without desktop input
        env:
          ZENX_COMPUTER_CONSTRUCTION_EVIDENCE: ${{ runner.temp }}/computer-event-construction.json
        run: node --import tsx --test apps/zenx/test/computer-native-dispatch.test.ts apps/zenx/test/computer-native-construction.test.ts apps/zenx/test/computer-bound-native.test.ts
      - name: Retain construction-only CoreGraphics metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: computer-event-construction-${{ github.sha }}
          path: ${{ runner.temp }}/computer-event-construction.json
          if-no-files-found: warn
          retention-days: 14
      - name: Observe owned native Computer drag and AX reacquisition when existing trust permits
        timeout-minutes: 5
        env:
          ZENX_COMPUTER_OWNED_NATIVE_ACCEPTANCE: "1"
          ZENX_COMPUTER_OWNED_NATIVE_EVIDENCE: ${{ runner.temp }}/computer-owned-native-acceptance.json
        # No permission prompt or TCC change. AX-denied is explicitly blocked,
        # never counted as native delivery/reacquisition acceptance.
        run: node --import tsx --test apps/zenx/test/computer-owned-native-acceptance.test.ts apps/zenx/test/computer-native-drag-receiver.test.ts
      - name: Retain same-run owned Computer native acceptance or blocker
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: computer-owned-native-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/computer-owned-native-acceptance.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify bound Computer process ownership and capture retirement
        run: node --import tsx --test apps/zenx/test/computer-target-transport.test.ts apps/zenx/test/computer-target-session.test.ts
      - name: Verify native inspection budgets and static-text labels with synthetic attributes
        run: node --import tsx --test apps/zenx/test/computer-static-text-label.test.ts apps/zenx/test/computer-native-inspect.test.ts
      - name: Verify real local Vision OCR with synthetic English and CJK pixels
        env:
          ZENX_COMPUTER_OCR_EVIDENCE: ${{ runner.temp }}/computer-native-ocr.json
        run: node --import tsx --test apps/zenx/test/computer-ocr.test.ts apps/zenx/test/computer-target-session.test.ts apps/zenx/test/computer-native-ocr.test.ts
      - name: Retain synthetic native Vision OCR evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: computer-native-ocr-${{ github.sha }}
          path: ${{ runner.temp }}/computer-native-ocr.json
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise macOS login-shell PATH and first tool execution
        run: npm --workspace apps/zenx exec -- tsx --test test/login-shell-environment.test.ts
      - name: Verify native launch observer and hung-main cleanup contracts
        timeout-minutes: 2
        run: node --import tsx --test --test-timeout=30000 apps/zenx/test/macos-launch-path-smoke.test.mjs apps/zenx/test/macos-launch-path-cleanup.test.mjs
      - name: Exercise LaunchServices PATH and packaged capabilities from one build
        env:
          ZENX_LAUNCH_PATH_EVIDENCE: ${{ runner.temp }}/zenx-launch-path-evidence
        run: node apps/zenx/scripts/smoke-macos-launch-path.mjs --capabilities
      - name: Retain independent LaunchServices PATH evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-launch-path-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-launch-path-evidence
          if-no-files-found: warn
          retention-days: 14

  zenx-windows-computer-smoke:
    name: ZenX Windows WinApp adapter smoke
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINAPP_CLI_UPDATE_CHECK: "0"
      WINAPP_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Microsoft WinApp CLI
        uses: microsoft/setup-WinAppCli@b93bbddc1f7abc061ca0d3a8119e3a0c7dd71495 # v0.2
        with:
          version: v0.3.1
      - name: Report WinApp CLI version
        run: winapp --version
      - run: npm ci
      - name: Exercise shared Shell ConPTY on Windows
        timeout-minutes: 1
        env:
          ZENX_SHELL_TEST_DIAGNOSTICS: "1"
        run: node --import tsx --test --test-timeout=30000 apps/zenx/test/shell-panel-service.test.ts
      - name: Verify owned ConPTY cleanup and native subprocess settlement
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: node --import tsx --test --test-timeout=40000 apps/zenx/test/shell-pty-native-cleanup.test.ts
      - name: Exercise shell lifecycle observations on Windows
        run: npm run build && node --test dist/test/shell-lifecycle.test.js
      - name: Exercise trigger process containment on Windows
        run: npm --workspace apps/zenx exec -- tsx --test test/trigger-program-runner.test.ts
      - name: Verify native smoke phase snapshot sharing
        run: node --import tsx --test --test-timeout=30000 apps/zenx/test/windows-smoke-phase.test.ts
      - run: npm --workspace apps/zenx run smoke:windows-computer

  zenx-windows-packaged-provider-smoke:
    name: ZenX Windows packaged bundled-provider smoke
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      WINAPP_CLI_UPDATE_CHECK: "0"
      WINAPP_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/winappCli
          ref: c8ada4a403c43b96780b87abc454cba51f649c60 # v0.3.1
          path: .native-sources/winappcli
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/zenx-dotnet-candidate
        with:
          dotnet-version: 10.0.401
      - name: Validate downstream build and assembly contracts
        run: node --test apps/zenx/test/winapp-downstream-build.test.mjs apps/zenx/test/winapp-downstream-assembly.test.mjs apps/zenx/test/winapp-downstream-symbols.test.mjs
      - name: Build one native provider for this authorized app-build run
        id: build-downstream
        run: node scripts/build-zenx-winapp-downstream.mjs --source .native-sources/winappcli --output "${{ runner.temp }}/zenx-winapp-downstream" --symbols-output "${{ runner.temp }}/zenx-winapp-symbols"
      - name: Cache verified provider archives
        uses: actions/cache@v4
        with:
          path: apps/zenx/.packaged/cache/artifacts/sha256/[0-9a-f]*
          key: zenx-provider-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/zenx/resources/providers/provider-lock.json') }}
      - run: npm ci
      - name: Exercise Windows publish handle lifecycle and rollback
        run: |
          npm run build --workspace @zenx/plugin-sdk
          node --import tsx --test --test-name-pattern="publishes a complete|publishing retries|exhausted EPERM|non-EPERM publication|missing source|publish rejects|rollback failure|publish preserves backup|Windows publishes|concurrent packaging" apps/zenx/test/package-zenx-portable.test.mjs
      - name: Validate the same-build Windows smoke guard assembly
        run: node --import tsx --test --test-timeout=120000 apps/zenx/test/windows-smoke-guard-build.test.mjs
      - name: Validate native fixture readiness dispatch ordering
        run: node --test apps/zenx/test/windows-packaged-uia-readiness.test.mjs apps/zenx/test/windows-packaged-uia-diagnostics.test.mjs
      - name: Package and diagnose Windows smoke publication
        env:
          ZENX_PACKAGE_DIAG: "1"
          ZENX_NATIVE_GUARD_DIAGNOSTICS_DIR: ${{ runner.temp }}/zenx-native-guard-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm --workspace apps/zenx run smoke:packaged -- --downstream "${{ runner.temp }}/zenx-winapp-downstream" --downstream-sha256 "${{ steps.build-downstream.outputs.provenance-sha256 }}"
      - name: Retain only this run's sanitized native guard failure receipts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-guard-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-native-guard-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Confirm packaged smoke left no shared build output
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath apps/zenx/out) {
            throw "smoke:packaged wrote shared apps/zenx/out"
          }
      - name: Package the real ZenX portable app
        run: npm --workspace apps/zenx run package:portable -- --downstream "${{ runner.temp }}/zenx-winapp-downstream" --downstream-sha256 "${{ steps.build-downstream.outputs.provenance-sha256 }}"
      - name: Exercise packaged Chrome native host framing
        run: node apps/zenx/scripts/smoke-chrome-native-host.mjs
      - name: Inspect the portable app without launching it
        shell: pwsh
        run: |
          $artifact = "apps/zenx/.packaged/artifact/ZenX-win32-x64"
          $required = @(
            "$artifact/ZenX.exe",
            "$artifact/resources/app/package.json",
            "$artifact/resources/app/out/main/index.js",
            "$artifact/resources/app/out/main/app-server-host.js",
            "$artifact/resources/app/out/preload/index.cjs",
            "$artifact/resources/app/out/renderer/index.html",
            "$artifact/resources/app/node_modules/ws/package.json",
            "$artifact/resources/providers/manifest.json",
            "$artifact/resources/providers/zenx-winapp-uia/bin/winapp.exe",
            "$artifact/resources/providers/zenx-winapp-uia/bin/libSkiaSharp.dll",
            "$artifact/resources/providers/zenx-winapp-uia/provenance.json",
            "$artifact/resources/providers/zenx-winapp-uia/packages.lock.json",
            "$artifact/resources/providers/playwright-browsers/chromium-1237/INSTALLATION_COMPLETE",
            "$artifact/resources/providers/playwright-browsers/chromium-1237/chrome-win64/chrome.exe"
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Portable ZenX is missing $path"
            }
          }

          if (Test-Path -LiteralPath apps/zenx/out) {
            throw "package:portable wrote shared apps/zenx/out"
          }

          $manifest = Get-Content -Raw -LiteralPath "$artifact/resources/providers/manifest.json" | ConvertFrom-Json
          $browserAssets = @($manifest.providers.'playwright-cli'.assets)
          if ($browserAssets.Count -lt 3 -or !($browserAssets | Where-Object { $_.kind -eq 'directory' -and $_.path -eq 'playwright-browsers\chromium-1237' })) {
            throw "Portable ZenX manifest does not cover the browser payload"
          }

      - name: Exercise Project identity rules
        run: npm --workspace apps/zenx run test:project-identity
      - name: Exercise Project workspace with the same packaged app
        shell: pwsh
        run: ./apps/zenx/scripts/windows-project-workspace-smoke.ps1 -PackagedExecutable "apps/zenx/.packaged/artifact/ZenX-win32-x64/ZenX.exe"
      - name: Verify startup harness failure and cleanup assertions
        run: node --test apps/zenx/test/windows-startup-harness.test.mjs
      - name: Observe native startup with delayed and failed bootstrap
        shell: pwsh
        run: ./apps/zenx/scripts/windows-startup-acceptance.ps1 -PackageDirectory "apps/zenx/.packaged/artifact/ZenX-win32-x64"
      - name: Retain Windows startup acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenx-windows-startup-evidence
          path: apps/zenx/.packaged/startup-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the same-run native input and provenance for review
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenx-winapp-product-input-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-winapp-downstream
          if-no-files-found: warn
          retention-days: 14
      - name: Collect the actual portable app trust inputs
        if: ${{ always() }}
        shell: pwsh
        run: |
          $resources = Join-Path $PWD "apps/zenx/.packaged/artifact/ZenX-win32-x64/resources"
          $manifest = Join-Path $resources "providers/manifest.json"
          if (!(Test-Path -LiteralPath $manifest -PathType Leaf)) {
            Write-Host "No actual portable app manifest was produced."
            exit 0
          }
          $digest = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $main = Join-Path $resources "app/out/main"
          $anchors = @(Get-ChildItem -LiteralPath $main -Recurse -File -Filter "*.js" | Where-Object {
            [System.IO.File]::ReadAllText($_.FullName).Contains($digest, [System.StringComparison]::Ordinal)
          })
          if ($anchors.Count -eq 0) {
            throw "The actual portable app has no compiled anchor matching its manifest bytes."
          }
          $proof = Join-Path $env:RUNNER_TEMP "zenx-winapp-product-proof"
          $providers = Join-Path $proof "resources/providers"
          New-Item -ItemType Directory -Force -Path $providers | Out-Null
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $providers "manifest.json")
          Copy-Item -LiteralPath (Join-Path $resources "providers/zenx-winapp-uia") -Destination $providers -Recurse
          $anchorReceipts = @()
          foreach ($anchor in $anchors) {
            $relative = [System.IO.Path]::GetRelativePath($resources, $anchor.FullName)
            $destination = Join-Path (Join-Path $proof "resources") $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath $anchor.FullName -Destination $destination
            $anchorReceipts += @{ path = $relative; sha256 = (Get-FileHash -LiteralPath $anchor.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          @{ schemaVersion = 1; manifestSha256 = $digest; compiledAnchors = $anchorReceipts } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $proof "trust-evidence.json") -Encoding utf8
      - name: Retain the actual portable app trust inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenx-winapp-product-proof-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-winapp-product-proof
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Inspect the generated RuntimeId ABI without element contents
        if: ${{ always() }}
        shell: pwsh
        run: |
          $source = Join-Path $PWD ".native-sources/winappcli/src/winapp-CLI/WinApp.Cli"
          $files = @(Get-ChildItem -LiteralPath (Join-Path $source "obj") -Recurse -File -Filter "*.NativeMethods.g.cs" |
            Where-Object { $_.FullName -match '[\\/]Generated[\\/]CsWin32[\\/]' })
          function Find-Definition($lines, $pattern) {
            for ($start = 0; $start -lt $lines.Length; $start++) {
              if ($lines[$start] -notmatch $pattern) { continue }
              $depth = 0; $opened = $false
              for ($end = $start; $end -lt $lines.Length; $end++) {
                if ($lines[$end].Contains("{")) { $opened = $true }
                $depth += ([regex]::Matches($lines[$end], '\{')).Count
                $depth -= ([regex]::Matches($lines[$end], '\}')).Count
                if ($opened -and $depth -eq 0) { return @{ start = $start; end = $end } }
              }
              throw "Generated ABI definition was incomplete."
            }
            return $null
          }
          $snippets = [System.Collections.Generic.List[string]]::new()
          $foundArray = $false; $foundMethod = $false
          foreach ($file in $files) {
            $lines = [System.IO.File]::ReadAllLines($file.FullName)
            $relative = [System.IO.Path]::GetRelativePath($source, $file.FullName)
            $array = Find-Definition $lines '^\s*(?:public|internal).*\bstruct\s+SAFEARRAY\b'
            if ($null -ne $array) {
              if ($array.end - $array.start -gt 256) { throw "Generated SAFEARRAY exceeds diagnostic bound." }
              $snippets.Add("FILE ${relative}:$($array.start + 1) SAFEARRAY")
              $first = [Math]::Max(0, $array.start - 8); $last = $array.end
              $snippets.Add(($lines[$first..$last] -join "`n"))
              $foundArray = $true
            }
            $element = Find-Definition $lines '^\s*(?:public|internal).*\binterface\s+IUIAutomationElement\b'
            if ($null -ne $element) {
              for ($line = $element.start; $line -le $element.end; $line++) {
                if ($lines[$line] -notmatch '\bGetRuntimeId\s*\(') { continue }
                $snippets.Add("FILE ${relative}:$($line + 1) IUIAutomationElement.GetRuntimeId")
                $first = [Math]::Max($element.start, $line - 12); $last = [Math]::Min($element.end, $line + 12)
                $snippets.Add(($lines[$first..$last] -join "`n"))
                $foundMethod = $true
              }
            }
          }
          if (!$foundArray -or !$foundMethod) { throw "Expected generated RuntimeId ABI symbols were unavailable." }
          $text = $snippets -join "`n`n"
          if ([System.Text.Encoding]::UTF8.GetByteCount($text) -gt 65536) { throw "Generated ABI exceeds diagnostic byte bound." }
          $evidence = Join-Path $env:RUNNER_TEMP "zenx-winapp-interop"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $evidence "runtime-id-abi.txt"), $text, [System.Text.UTF8Encoding]::new($false))
          Write-Host "::group::Generated RuntimeId ABI (no element data)"
          Write-Host $text
          Write-Host "::endgroup::"
      - name: Retain the bounded generated RuntimeId ABI
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenx-winapp-runtime-id-abi-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-winapp-interop/runtime-id-abi.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Retain detached native debug symbols as same-run build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenx-winapp-debug-symbols-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zenx-winapp-symbols/winapp.pdb
            ${{ runner.temp }}/zenx-winapp-symbols/symbols-provenance.json
          if-no-files-found: warn
          retention-days: 14

  zenx-windows-user-browser-smoke:
    name: ZenX Windows attached user-browser smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install a pinned headed Chromium fixture
        shell: pwsh
        run: |
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP "zenx-browser-fixture"
          npm install --prefix $fixtureDirectory --no-package-lock --no-audit --no-fund playwright@1.63.0
          if ($LASTEXITCODE -ne 0) { throw "Could not install the pinned browser fixture" }
          node (Join-Path $fixtureDirectory "node_modules/playwright/cli.js") install chromium
          if ($LASTEXITCODE -ne 0) { throw "Could not download the pinned Chromium build" }
          $env:ZENX_CI_PLAYWRIGHT = Join-Path $fixtureDirectory "node_modules/playwright"
          $browserExecutable = node -e "process.stdout.write(require(process.env.ZENX_CI_PLAYWRIGHT).chromium.executablePath())"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $browserExecutable)) { throw "Chromium executable is missing" }
          # The unpacked browser needs AppContainer/LPAC read-execute access for
          # its sandboxed renderer and network processes (no sandbox bypass).
          $browserDirectory = Split-Path -Parent $browserExecutable
          icacls $browserDirectory /grant '*S-1-15-2-1:(OI)(CI)(RX)' '*S-1-15-2-2:(OI)(CI)(RX)' /T /Q
          if ($LASTEXITCODE -ne 0) { throw "Could not grant Chromium sandbox read-execute access" }
          "ZENX_USER_BROWSER_EXECUTABLE=$browserExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm --workspace apps/zenx run smoke:windows-user-browser
      - name: Exercise parallel native user typing and inactive Agent tab input
        env:
          ZENX_REQUIRE_OS_INPUT: "1"
          ZENX_PARALLEL_INPUT_ARTIFACT_DIR: ${{ runner.temp }}/zenx-parallel-input-evidence
        run: npm --workspace apps/zenx run smoke:browser-parallel-input
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-parallel-input
          path: ${{ runner.temp }}/zenx-parallel-input-evidence
          if-no-files-found: ignore

  zenx-playwright-provider-smoke:
    name: ZenX real Playwright provider smoke
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify native Electron Trace frame ownership
        timeout-minutes: 2
        run: node apps/zenx/scripts/smoke-durable-trace-electron.mjs "${{ runner.temp }}/zenx-trace-electron"
      - name: Retain synthetic native Trace frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-trace-frame-gate-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-trace-electron
          if-no-files-found: warn
          retention-days: 14
      - name: Install the official Playwright CLI and Chromium
        run: |
          npm install --global @playwright/cli@0.1.18
          playwright-cli install-browser
      - name: Exercise provider selection and the real CLI adapter
        env:
          CI: "1"
          ZENX_REQUIRE_PLAYWRIGHT: "1"
        run: npm --workspace apps/zenx run smoke:providers
      - name: Verify native macOS file scroll-security contract
        timeout-minutes: 3
        run: |
          node apps/zenx/scripts/build-file-sidebar-preview.mjs "${{ runner.temp }}/zenx-file-electron"
          cd apps/zenx
          npx --no-install electron scripts/capture-file-sidebar-electron.cjs "${{ runner.temp }}/zenx-file-electron" --scope=scroll-security
      - name: Retain synthetic native file scroll-security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-file-scroll-security-${{ github.sha }}
          path: ${{ runner.temp }}/zenx-file-electron
          if-no-files-found: warn
          retention-days: 14
      - name: Verify Workspace browser storage across fresh Electron processes
        timeout-minutes: 2
        run: node apps/zenx/scripts/workspace-browser-persistence-smoke.mjs
      - name: Exercise Workspace background capture and targeted input
        timeout-minutes: 3
        working-directory: apps/zenx
        env:
          ZENX_BROWSER_BLANK_ARTIFACT_DIR: ${{ runner.temp }}/zenx-browser-blank-evidence
        run: npx --no-install electron ./out/main/workspace-browser-smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-browser-blank-appearance
          path: ${{ runner.temp }}/zenx-browser-blank-evidence
          if-no-files-found: ignore
      - name: Prepare a pinned headed Chromium for parallel input
        run: |
          fixture="$RUNNER_TEMP/zenx-browser-fixture"
          npm install --prefix "$fixture" --no-package-lock --no-audit --no-fund playwright@1.63.0
          node "$fixture/node_modules/playwright/cli.js" install chromium
          browser=$(node -e "process.stdout.write(require(process.argv[1]).chromium.executablePath())" "$fixture/node_modules/playwright")
          echo "ZENX_USER_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
      - name: Verify native idle sampling and exact dispatch guards
        timeout-minutes: 2
        run: node --test apps/zenx/test/browser-parallel-idle-sampling.test.mjs
      - name: Exercise Chrome foreground and background parallel input on macOS
        env:
          ZENX_PARALLEL_INPUT_ARTIFACT_DIR: ${{ runner.temp }}/zenx-parallel-input-evidence
        # The report explicitly marks OS typing unverified when AX is unavailable.
        # It does not request permission and a CDP-only pass is not native OS acceptance.
        run: npm --workspace apps/zenx run smoke:browser-parallel-input
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-browser-parallel-input
          path: ${{ runner.temp }}/zenx-parallel-input-evidence
          if-no-files-found: ignore

  android-mobile:
    name: Android TLS Host integration and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          # Expo generates android/ below, so key the cache from its inputs.
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/mobile/app.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm ci
        working-directory: .
      - run: npm run test:host
      - run: npm run prebuild -- --no-install
      - run: ./gradlew assembleDebug --build-cache
        working-directory: apps/mobile/android
      - name: Try preinstalled headless Android emulator screenshot (fixture only)
        run: timeout 240 ./scripts/capture-installed-emulator.sh
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: hashFiles('apps/mobile/evidence/android-fixture-emulator.png') != ''
        with:
          name: zenx-mobile-android-fixture-screenshot
          path: apps/mobile/evidence/android-fixture-emulator.png
      - uses: actions/upload-artifact@v4
        with:
          name: zenx-mobile-integration-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
