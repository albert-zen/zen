name: Owned native preview overlap evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  native-overlay-evidence:
    if: github.head_ref == 'evidence/preview-native-overlap-20261104'
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @zenx/plugin-sdk
      - name: Build exact production components and native owner
        run: node apps/zenx/scripts/preview-overlap-evidence/build.mjs "$RUNNER_TEMP/preview-overlap-evidence"
      - name: Capture only the owned composed window with existing permission
        timeout-minutes: 2
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$RUNNER_TEMP/preview-overlap-evidence/run-host.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-preview-overlap-${{ github.sha }}
          path: ${{ runner.temp }}/preview-overlap-evidence
          retention-days: 14
