name: Native history window evidence

on:
  pull_request:
    paths:
      - .github/workflows/native-history.yml
      - src/thread-history-window.ts
      - src/thread.ts
      - src/app-server.ts
      - src/protocol/native/**
      - test/native-history-window.test.ts
      - test/thread-history-window*.ts
      - apps/zenx/src/protocol-client/**
      - apps/zenx/src/renderer/src/**
      - apps/zenx/evals/native-history/**
      - apps/zenx/scripts/measure-native-history.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify native windows and recovery compatibility
        run: node --test dist/test/thread-history-window.test.js dist/test/native-history-window.test.js
      - name: Verify page merge, source navigation, drafts and reconnect
        run: node --import tsx --test apps/zenx/test/thread-history-pages.test.ts apps/zenx/test/protocol-client.test.ts apps/zenx/test/virtual-quote-source-interaction.test.ts apps/zenx/test/virtual-transcript-find.test.ts
      - name: Measure production Host and Chromium page operations
        run: node --expose-gc apps/zenx/scripts/measure-native-history.mjs "${{ runner.temp }}/native-history"
      - name: Retain exact measurements, screenshots and browser lifecycle including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-history-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-history/*.json
            ${{ runner.temp }}/native-history/*.png
            ${{ runner.temp }}/native-history/*.log
          if-no-files-found: warn
          retention-days: 14
