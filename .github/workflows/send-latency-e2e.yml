name: Native ordinary-send isolated A-B
on:
  push:
    branches: [diagnostic/send-latency-e2e-20261102]
    paths:
      - .github/workflows/send-latency-e2e.yml
      - apps/zenx/scripts/capture-send-latency.cjs
      - apps/zenx/scripts/launch-send-latency.mjs
      - apps/zenx/scripts/long-thread-domain-seed.mjs
permissions:
  contents: read
jobs:
  native-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            source: 6aa0a5055530eeb018cc41a3ce486603756c06bb
            count: 1000
          - label: frontend
            source: 3819977ddd2da5698bcbee2c14fd8165f9934009
            count: 1000
          - label: backend
            source: 8e036167d864ae5d452dccc411970352ce26e433
            count: 1000
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
          path: product
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy only diagnostic drivers to exact product checkout
        run: |
          cp diagnostic/apps/zenx/scripts/capture-send-latency.cjs product/apps/zenx/scripts/
          cp diagnostic/apps/zenx/scripts/launch-send-latency.mjs product/apps/zenx/scripts/
          cp diagnostic/apps/zenx/scripts/long-thread-domain-seed.mjs product/apps/zenx/scripts/
      - name: Install exact source dependencies
        working-directory: product
        timeout-minutes: 7
        run: npm ci
      - name: Build production storage and actual App
        working-directory: product
        timeout-minutes: 8
        run: |
          npm run build
          npm run build --workspace @zen/zenx
      - name: Full native App ordinary send
        working-directory: product
        timeout-minutes: 12
        run: node apps/zenx/scripts/launch-send-latency.mjs ../results '${{ matrix.count }}' '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-send-${{ matrix.label }}-${{ matrix.count }}
          path: results
          if-no-files-found: error
