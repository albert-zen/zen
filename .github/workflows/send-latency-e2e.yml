name: Native long-thread send baseline
on:
  push:
    branches: [diagnostic/send-latency-e2e-20261102]
    paths:
      - .github/workflows/send-latency-e2e.yml
      - apps/zenx/scripts/capture-send-latency.cjs
      - apps/zenx/scripts/launch-send-latency.mjs
      - apps/zenx/scripts/long-thread-domain-seed.mjs
permissions:
  contents: read
jobs:
  native-macos:
    strategy:
      fail-fast: false
      matrix:
        prior-user-messages: [0, 1000, 5000]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6aa0a5055530eeb018cc41a3ce486603756c06bb
          persist-credentials: false
          path: product
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy only diagnostic drivers to exact product checkout
        run: |
          cp diagnostic/apps/zenx/scripts/capture-send-latency.cjs product/apps/zenx/scripts/
          cp diagnostic/apps/zenx/scripts/launch-send-latency.mjs product/apps/zenx/scripts/
          cp diagnostic/apps/zenx/scripts/long-thread-domain-seed.mjs product/apps/zenx/scripts/
      - name: Install exact source dependencies
        working-directory: product
        timeout-minutes: 7
        run: npm ci
      - name: Build production storage and actual App
        working-directory: product
        timeout-minutes: 8
        run: |
          npm run build
          npm run build --workspace @zen/zenx
      - name: Full native App ordinary send
        working-directory: product
        timeout-minutes: 6
        run: node apps/zenx/scripts/launch-send-latency.mjs ../results '${{ matrix.prior-user-messages }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-send-${{ matrix.prior-user-messages }}
          path: results
          if-no-files-found: error
