name: Read native Recent synthetic screenshots
on:
  push:
    branches: [diagnostic/send-latency-e2e-20261102]
    paths: [.github/workflows/recent-order-images.yml]
permissions:
  contents: read
  actions: read
jobs:
  read-existing-synthetic-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 41406567098
          github-token: ${{ github.token }}
          name: full-app-recent-order
          path: recall
      - name: Emit four bounded whole-App Recent images
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          function walk(p){return fs.readdirSync(p,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(p,e.name)):[path.join(p,e.name)]);}
          const files=walk('recall');
          for(const name of ['recent-01-cold-original-message-order.png','recent-02-background-tool-does-not-reorder.png','recent-03-final-bumps-without-stealing-selection.png','recent-04-reload-preserves-order.png']){
            const matches=files.filter(f=>path.basename(f)===name);
            const selected=matches;
            assert.equal(selected.length,1,name);
            const bytes=fs.readFileSync(selected[0]);assert(bytes.length>0&&bytes.length<=1048576);
            assert.equal(bytes.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
            console.log('SYNTHETIC_RECENT_IMAGE '+JSON.stringify({sourceRun:41406567098,source:'e5c3fe9bf91ce0385bf730cd364b3035a82fa461',name,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),base64:bytes.toString('base64')}));
          }
          NODE
