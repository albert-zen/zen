name: Owned Host CPU and storage phases (instrumented)
on:
  push:
    branches: [diagnostic/send-latency-e2e-20261102]
    paths:
      - .github/workflows/send-host-profile.yml
      - apps/zenx/scripts/capture-send-host-profile.cjs
      - apps/zenx/scripts/launch-send-host-profile.mjs
      - apps/zenx/scripts/long-thread-domain-seed.mjs
      - apps/zenx/scripts/diagnostic/synthetic-backend-profiler.ts
permissions:
  contents: read
jobs:
  native-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pending
            source: b8c77b80fa547fddfa7875e11a932d37b143e473
            count: 5000
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
          path: product
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy only diagnostic drivers to exact product checkout
        run: |
          cp diagnostic/apps/zenx/scripts/capture-send-host-profile.cjs product/apps/zenx/scripts/
          cp diagnostic/apps/zenx/scripts/launch-send-host-profile.mjs product/apps/zenx/scripts/
          cp diagnostic/apps/zenx/scripts/long-thread-domain-seed.mjs product/apps/zenx/scripts/
          cp diagnostic/apps/zenx/scripts/diagnostic/synthetic-backend-profiler.ts product/apps/zenx/src/main/
          node <<'NODE'
          const fs=require("node:fs");
          const file="product/apps/zenx/src/main/app-server-host.ts";
          const base=fs.readFileSync(file,"utf8");
          const marker='process.on("message",';
          if(base.split(marker).length!==2)throw Error("Expected exactly one real Host message hook");
          const source='import { installSyntheticBackendProfiler } from "./synthetic-backend-profiler.js";\n'+base.replace(marker,'installSyntheticBackendProfiler();\n\n'+marker);
          fs.writeFileSync(file,source);
          NODE
      - name: Install exact source dependencies
        working-directory: product
        timeout-minutes: 7
        run: npm ci
      - name: Build production storage and actual App
        working-directory: product
        timeout-minutes: 8
        run: |
          npm run build
          npm run prepare:first-party-plugins --workspace @zen/zenx
          npm run typecheck:prepared --workspace @zen/zenx
          npm run build --workspace @zen/zenx
      - name: Full native App ordinary send
        working-directory: product
        timeout-minutes: 12
        run: node apps/zenx/scripts/launch-send-host-profile.mjs ../results '${{ matrix.count }}' '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-owned-host-profile-${{ matrix.count }}
          path: results
          if-no-files-found: error
