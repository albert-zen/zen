name: Packaged Legend native editing and reader quality (WIP experiment)
on:
  push:
    branches: [diagnostic/send-legend-ui-quality-20261103]
    paths:
      - .github/workflows/send-information-layout-ab.yml
      - apps/zenx/scripts/capture-send-feedback-verified-frame.cjs
      - apps/zenx/scripts/launch-send-focus-paired.mjs
      - apps/zenx/scripts/summarize-send-timeline.cjs
      - apps/zenx/scripts/test-send-feedback-observation.cjs
      - apps/zenx/scripts/test-send-timeline-summary.cjs
permissions:
  contents: read
jobs:
  native-getter-macos:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ffcc0f3db9081c2f21ef6ab20b8bfe82330eb9d
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy existing bounded diagnostic into the exact source checkout
        run: |
          for source in candidate; do
            cp diagnostic/apps/zenx/scripts/capture-send-feedback-verified-frame.cjs "$source/apps/zenx/scripts/capture-send-feedback.cjs"
            cp diagnostic/apps/zenx/scripts/launch-send-focus-paired.mjs "$source/apps/zenx/scripts/launch-send-feedback.mjs"
            cp diagnostic/apps/zenx/scripts/long-thread-domain-seed.mjs "$source/apps/zenx/scripts/"
            cp diagnostic/apps/zenx/scripts/summarize-send-timeline.cjs "$source/apps/zenx/scripts/"
          done
      - name: Build the exact latest single-source Legend quality candidate
        timeout-minutes: 16
        run: |
          for source in candidate; do
            (cd "$source" && npm ci && npm run build && npm run build --workspace @zen/zenx)
          done
      - name: Verify existing observer identity and post-geometry timing contracts
        working-directory: candidate
        run: node --test ../diagnostic/apps/zenx/scripts/test-send-feedback-observation.cjs ../diagnostic/apps/zenx/scripts/test-recall-profile-review.cjs ../diagnostic/apps/zenx/scripts/test-send-native-phase-summary.cjs ../diagnostic/apps/zenx/scripts/test-send-timeline-summary.cjs
      # Reviewed visible coverage permits offscreen retained rows, never visible gaps.
      - name: Native dock Enter and post-timing Find/Selection/Copy quality, default remains off
        timeout-minutes: 20
        run: |
          failed=0
          for case_spec in "1280 enter control candidate"; do
            read -r width activation prefix source <<< "$case_spec"
            case="$prefix-$source"
            mkdir -p "results/$case"
            echo "NATIVE_AB_CASE_BEGIN $case $source $width"
            set +e
            (cd "$source" && node apps/zenx/scripts/launch-send-feedback.mjs "../results/$case" 5000 "$source" "$case" "$width" "$activation")
            status=$?
            set -e
            printf '%s\n' "$status" > "results/$case/launcher-exit-code.txt"
            if [ "$status" -ne 0 ]; then failed=1; fi
            echo "NATIVE_AB_CASE_END $case $source $width exit=$status"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-legend-find-reader-quality-5000
          # Owned synthetic PNGs survive a later diagnostic assertion failure.
          path: |
            results/*/send-information-layout.summary.json
            results/*/failure.json
            results/*/lifecycle.json
            results/*/*.png
            results/*/launcher-exit-code.txt
          if-no-files-found: error
