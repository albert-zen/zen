name: Packaged send first-gap attribution (diagnostic only)
# Fixed packaged 5000-turn fixture and three send samples; preserve every attempt.
# Resume after correcting the post-shutdown export guard (2026-11-03).
on:
  push:
    branches: [diagnostic/packaged-send-first-gap-20261102]
    paths: [.github/workflows/recall-send-profile.yml]
permissions:
  contents: read
jobs:
  native-macos:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: profile
            source: 9188f8e915f25ae4d693fae43ad5b8350282a87f
            count: 5000
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
          path: product
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify private profile publication guards with synthetic inputs
        run: node --test diagnostic/apps/zenx/scripts/test-recall-profile-review.cjs diagnostic/apps/zenx/scripts/test-send-timeline-summary.cjs
      - name: Copy only diagnostic drivers to exact product checkout
        run: |
          cp diagnostic/apps/zenx/scripts/capture-recall-send-profile.cjs product/apps/zenx/scripts/capture-send-feedback.cjs
          cp diagnostic/apps/zenx/scripts/launch-recall-send-profile.mjs product/apps/zenx/scripts/launch-send-feedback.mjs
          cp diagnostic/apps/zenx/scripts/long-thread-domain-seed.mjs product/apps/zenx/scripts/
          cp diagnostic/apps/zenx/scripts/summarize-send-timeline.cjs product/apps/zenx/scripts/
      - name: Install exact source dependencies
        working-directory: product
        timeout-minutes: 7
        run: npm ci
      - name: Build production storage and actual App
        working-directory: product
        timeout-minutes: 8
        run: |
          npm run build
          npm run build --workspace @zen/zenx
      - name: Profile full native App ordinary send (diagnostic only)
        working-directory: product
        timeout-minutes: 25
        run: node apps/zenx/scripts/launch-send-feedback.mjs ../results '${{ matrix.count }}' '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-send-first-gap-9188
          path: results/owned-native-send-profile.summary.json
          if-no-files-found: error

