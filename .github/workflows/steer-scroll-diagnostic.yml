name: Synthetic steer scroll ownership diagnostic

on:
  pull_request:
    paths:
      - apps/zenx/scripts/steer-scroll-diagnostic.mjs
      - apps/zenx/scripts/build-steer-image-preview.mjs
      - apps/zenx/scripts/capture-steer-image-preview.mjs
      - .github/workflows/steer-scroll-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore verified desktop archives
        timeout-minutes: 5
        id: desktop-archives
        uses: ./.github/actions/desktop-archive-cache
        with:
          phase: restore
      - run: npm ci
      - name: Verify synthetic diagnostic contracts
        run: node --test apps/zenx/test/steer-scroll-diagnostic.test.mjs
      - name: Resolve existing CJK package source
        run: node apps/zenx/scripts/prepare-cjk-fonts.mjs resolve "${{ runner.temp }}/steer-diagnostic-fonts"
      - name: Verify CJK prerequisites
        run: node apps/zenx/scripts/prepare-cjk-fonts.mjs install "${{ runner.temp }}/steer-diagnostic-fonts"
      - name: Observe one new synthetic narrow held scene
        timeout-minutes: 4
        run: |
          node apps/zenx/scripts/build-steer-image-preview.mjs "${{ runner.temp }}/steer-scroll-diagnostic" --diagnostic
          node apps/zenx/scripts/capture-steer-image-preview.mjs "${{ runner.temp }}/steer-scroll-diagnostic" --diagnostic
      - name: Retain exact source, input receipts and scroll write stacks
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: steer-scroll-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/steer-scroll-diagnostic
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified desktop archives
        timeout-minutes: 5
        if: ${{ always() && steps.desktop-archives.outcome == 'success' }}
        uses: ./.github/actions/desktop-archive-cache
        with:
          phase: save
          electron-cache-hit: ${{ steps.desktop-archives.outputs.electron-cache-hit }}
          rtk-cache-hit: ${{ steps.desktop-archives.outputs.rtk-cache-hit }}
