[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "imzen"
version = "0.1.0"
description = "Thin IM channel client for the Zen App Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "imcodex @ git+https://github.com/albert-zen/imcodex.git@9f2f38da44aa88af0cdb82917cfee1d93ce02675",
]

[project.optional-dependencies]
feishu = [
  "lark-channel-sdk>=1.1.0,<2.0.0",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
imzen = "imzen.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imzen"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
