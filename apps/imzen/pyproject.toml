[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "imzen"
version = "0.1.0"
description = "Thin IM channel client for the Zen App Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "im-agent-sdk[appserver,qq,telegram,weixin] @ git+https://github.com/albert-zen/im-agent-sdk.git@c6bd9a45a333354d907968dd68c8b817deafaf26",
]

[project.optional-dependencies]
feishu = [
  "im-agent-sdk[feishu] @ git+https://github.com/albert-zen/im-agent-sdk.git@c6bd9a45a333354d907968dd68c8b817deafaf26",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
imzen = "imzen.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imzen"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
