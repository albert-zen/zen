function planSegments(keys, retainedKeys, protectedGaps = []) {
  if (new Set(keys).size !== keys.length) throw new Error("Duplicate row key");
  const retained = new Set(retainedKeys);
  const locked = new Map(protectedGaps.map((gap) => [gap.start, gap]));
  const output = [];
  for (let index = 0; index < keys.length;) {
    const pinned = locked.get(index);
    if (pinned) {
      output.push({
        ...pinned,
        kind: "gap",
        id: `gap:${pinned.start}:${pinned.end}`,
      });
      index = pinned.end;
    } else if (retained.has(keys[index])) {
      output.push({
        kind: "row",
        id: `row:${keys[index]}`,
        start: index,
        end: index + 1,
      });
      index++;
    } else {
      const start = index++;
      while (
        index < keys.length &&
        !retained.has(keys[index]) &&
        !locked.has(index)
      )
        index++;
      output.push({
        kind: "gap",
        id: `gap:${start}:${index}`,
        start,
        end: index,
      });
    }
  }
  return output;
}

function cloneProjection(source, mode = "host") {
  const clone = source.cloneNode(true);
  // cloneNode copies DOM, not React state/listeners. Removing a host element is
  // a separately tested hypothesis, never an assumed serialization invariant.
  if (mode === "pruned") {
    for (const node of clone.querySelectorAll("svg,button")) {
      if (!node.textContent && !node.querySelector("img,input,textarea,select"))
        node.remove();
    }
  }
  return clone;
}

function containsBoundary(node, boundary) {
  return boundary !== null && (node === boundary || node.contains(boundary));
}

function protectedSegments(container, selection) {
  if (!selection || selection.rangeCount === 0 || selection.isCollapsed)
    return [];
  return [...container.children].filter(
    (node) =>
      containsBoundary(node, selection.anchorNode) ||
      containsBoundary(node, selection.focusNode),
  );
}

/**
 * Apply a new ordered partition without moving any surviving DOM node. A stable
 * end sentinel or real boundary row keeps a page-wide Range across insertions.
 * Endpoint-containing gaps are indivisible until the native selection changes.
 */
function applySegments(container, plan, createNode, selection) {
  const before = [...container.children];
  const byId = new Map(before.map((node) => [node.dataset.segmentId, node]));
  const desired = new Set(plan.map((part) => part.id));
  const protectedNodes = protectedSegments(container, selection);
  if (protectedNodes.some((node) => !desired.has(node.dataset.segmentId))) {
    throw new Error("Refusing to replace a live Selection endpoint segment");
  }
  for (let index = 0; index < plan.length; index++) {
    const part = plan[index];
    if (byId.has(part.id)) continue;
    const next =
      plan
        .slice(index + 1)
        .map((item) => byId.get(item.id))
        .find(Boolean) ?? null;
    const node = createNode(part);
    node.dataset.segmentId = part.id;
    node.dataset.segmentStart = String(part.start);
    node.dataset.segmentEnd = String(part.end);
    container.insertBefore(node, next);
    byId.set(part.id, node);
  }
  for (const node of before) {
    if (!desired.has(node.dataset.segmentId)) node.remove();
  }
  const actual = [...container.children].map((node) => node.dataset.segmentId);
  if (actual.join("\0") !== plan.map((part) => part.id).join("\0")) {
    throw new Error(
      "Existing DOM order changed; reordering is intentionally unsupported",
    );
  }
}

function selectionSnapshot(document) {
  const selection = document.getSelection();
  return selection
    ? {
        anchorNode: selection.anchorNode,
        anchorOffset: selection.anchorOffset,
        focusNode: selection.focusNode,
        focusOffset: selection.focusOffset,
        text: selection.toString(),
        collapsed: selection.isCollapsed,
      }
    : null;
}

function sameEndpoints(left, right) {
  return (
    !!left &&
    !!right &&
    ["anchorNode", "anchorOffset", "focusNode", "focusOffset"].every(
      (name) => left[name] === right[name],
    )
  );
}

function firstDifference(expected, actual) {
  if (expected === actual) return null;
  let index = 0;
  while (index < expected.length && expected[index] === actual[index]) index++;
  return {
    index,
    expectedLength: expected.length,
    actualLength: actual.length,
    expected: expected.slice(Math.max(0, index - 24), index + 48),
    actual: actual.slice(Math.max(0, index - 24), index + 48),
  };
}

/* Browser-only instrumentation. This file does not register key/copy handlers. */
(() => {
  const viewport = document.querySelector("#viewport");
  const container = document.querySelector("#transcript");
  const result = document.querySelector("#result");
  const selection = () => document.getSelection();
  let rows = [],
    keys = [],
    heights = [],
    tops = [],
    baseline = "",
    mode = "full";
  let baselineHostCounts,
    retained = [],
    busy = false;
  const flatOracle = new Map();
  const nativeSlice = (start, end) => {
    const range = document.createRange();
    range.setStartBefore(rows[start]);
    range.setEndAfter(rows[end - 1]);
    selection().removeAllRanges();
    selection().addRange(range);
    return selection().toString();
  };
  const counts = (root = container) => ({
    elements: root.querySelectorAll("*").length,
    buttons: root.querySelectorAll("button").length,
    textCharacters: root.textContent.length,
  });
  const pick = (center) =>
    [...new Set([0, center - 1, center, center + 1, rows.length - 1])]
      .filter((index) => index >= 0 && index < rows.length)
      .map(String);
  const reset = () => {
    selection().removeAllRanges();
    container.innerHTML = Array.from(
      { length: 24 },
      (_, index) => rowHTML[index % rowHTML.length],
    ).join("");
    rows = [...container.children];
    keys = rows.map((row, index) => {
      row.dataset.rowKey = String(index);
      row.dataset.segmentId = `row:${index}`;
      row.dataset.segmentStart = String(index);
      row.dataset.segmentEnd = String(index + 1);
      return String(index);
    });
    heights = rows.map((row) => row.getBoundingClientRect().height);
    tops = heights.map((_, i) =>
      heights.slice(0, i).reduce((a, b) => a + b, 0),
    );
    baselineHostCounts = counts();
    baseline = nativeSlice(0, rows.length);
    // Capture every possible contiguous gap once, only in this oracle fixture.
    // Product projection has no such oracle for never-mounted historical rows.
    flatOracle.clear();
    for (let start = 0; start < rows.length; start++) {
      for (let end = start + 1; end <= rows.length; end++) {
        flatOracle.set(`${start}:${end}`, nativeSlice(start, end));
      }
    }
    selection().removeAllRanges();
    mode = "full";
    retained = keys;
    viewport.scrollTop = tops[12];
    return { baseline, baselineHostCounts };
  };
  const make = (part) => {
    if (part.kind === "row") return rows[part.start];
    const gap = document.createElement("div");
    gap.className = "projection-gap";
    gap.style.height = `${heights.slice(part.start, part.end).reduce((a, b) => a + b, 0)}px`;
    const body = document.createElement("div");
    body.className = "projection-body";
    if (mode === "flat") {
      const pre = document.createElement("pre");
      pre.className = "flat-gap";
      pre.textContent = flatOracle.get(`${part.start}:${part.end}`);
      body.append(pre);
    } else {
      for (let index = part.start; index < part.end; index++)

      .filter((node) => node.classList.contains("projection-gap"))
      .map((node) => ({
        start: Number(node.dataset.segmentStart),
        end: Number(node.dataset.segmentEnd),
      }));
    const pinnedRows = locked
      .filter((node) => node.dataset.rowKey !== undefined)
      .map((node) => node.dataset.rowKey);
    retained = [...new Set([...next, ...pinnedRows])];
    applySegments(
      container,
      planSegments(keys, retained, protectedGaps),
      make,
      selection(),
    );
    const after = selectionSnapshot(document);
    return {
      endpointsSame: sameEndpoints(snapshot, after),
      difference: firstDifference(snapshot?.text ?? "", after?.text ?? ""),
    };
  };
  const activate = (candidate) => {
    reset();
    mode = candidate;
    update(pick(12));
    return {
      mode,
      baselineCounts: baselineHostCounts,
      candidateCounts: counts(),
    };
  };
  const select = () => {
    const range = document.createRange();
    range.setStartBefore(container.firstElementChild);
    range.setEndAfter(container.lastElementChild);
    selection().removeAllRanges();
    selection().addRange(range);
    return selection().toString();
  };

    const metrics = activate(candidate);
    const initial = select();
    // Use actual first/last text nodes so the DOM-only mechanism deliberately
    // exercises stable endpoints. This is not the product's Cocoa Select All.
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    const all = [];
    while (walker.nextNode()) all.push(walker.currentNode);
    selection().setBaseAndExtent(all[0], 0, all.at(-1), all.at(-1).length);

    const middleBefore = rows[12];

      ...metrics,
      wholeSelectionDifference: firstDifference(baseline, initial),
      interiorReplacementDifference: firstDifference(
        selectedBefore.text,
        selectedAfter.text,

      endpointsSame: movement.endpointsSame,
      retainedBoundaryNodesSame:

      oldWindowRetainedIfEndpoint: container.contains(middleBefore),

      protectedSegments(container, selection()).some((node) =>

      const report = ["host", "pruned", "flat"].map(verify);
      result.textContent = JSON.stringify(report, null, 2);
      window.segmentFixture.lastReport = report;
      return report;

      busy = false;

    "scroll",
    () => {

      const center = Math.max(
        0,
        tops.findLastIndex((top) => top <= viewport.scrollTop),
      );
      update(pick(center));
    },
    { passive: true },
  );

  // original native event, without preventDefault, replay, or Range writes.
  viewport.addEventListener(
    "keydown",
    (event) => {
      if (mode !== "full" && /^(Arrow|Home$|End$|Page)/.test(event.key))
        fillAll();
    },
    true,
  );
  viewport.addEventListener(
    "pointerdown",
    () => {
      if (mode !== "full") fillAll();
    },
    true,
  );
  document.querySelector("#run").onclick = runAll;
  document.querySelector("#full").onclick = () => {
    reset();
    result.textContent = "Full baseline";
  };
  for (const name of ["host", "pruned", "flat"])

      result.textContent = JSON.stringify(activate(name), null, 2);
    };

    select();
  };
  window.segmentFixture = {
    reset,
    activate,
    select,
    update,
    verify,
    runAll,
    fillAll,
    counts,
    lastReport: null,
  };
  reset();
})();
