<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>前台电脑操作提示预览</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        color: #e4e7ed;
        background: #16191f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
      }
      .desktop {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 72% 18%, #34394e 0, transparent 58%),
          radial-gradient(ellipse at 10% 92%, #2a3741 0, transparent 55%),
          #191d25;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        color: #29313b;
      }
      :root[data-theme="light"] .desktop {
        background:
          radial-gradient(ellipse at 72% 18%, #d5ddea 0, transparent 58%),
          radial-gradient(ellipse at 10% 92%, #cbdeda 0, transparent 55%),
          #eef0f4;
      }
      iframe {
        position: fixed;
        border: 0;
        background: transparent;
      }
      #edge-preview {
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #status-preview {
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: min(480px, 100vw);
        height: 64px;
      }
      main {
        position: relative;
        max-width: 760px;
        margin: auto;
        padding: max(145px, 20vh) 28px 150px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      h1 {
        margin: 18px 0;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.15;
        font-weight: 450;
        letter-spacing: -0.035em;
      }
      p {
        max-width: 490px;
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        opacity: 0.65;
      }
      .workspace {
        margin-top: 44px;
        padding: 22px 0;
        border-top: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        border-color: #808c9d35;
      }
      .workspace label {
        display: block;
        font-size: 12px;
        opacity: 0.75;
        margin-bottom: 10px;
      }
      .workspace input {
        width: 100%;
        padding: 0;
        color: inherit;
        background: transparent;
        border: 0;
        font: inherit;
        font-size: 16px;
        outline-offset: 7px;
      }
      .controls {
        position: fixed;
        left: 24px;
        right: 24px;
        bottom: 24px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .controls label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
      }
      select,
      button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid #8592ac55;
        border-radius: 8px;
        background: #202631;
        color: #e4e7ed;
        font: inherit;
        font-size: 12px;
      }
      :root[data-theme="light"] select,
      :root[data-theme="light"] button {
        background: #f5f7fa;
        color: #29313b;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid #839cfc;
        outline-offset: 3px;
      }
      button[aria-pressed="true"] {
        border-color: #a0b3ff;
      }
      .note {
        flex: 0 0 100%;
        text-align: center;
        font-size: 11px;
        opacity: 0.55;
        margin-top: 8px;
      }
      @media (max-width: 420px) {
        main {
          padding: 120px 22px 210px;
        }
        .controls {
          left: 16px;
          right: 16px;
          bottom: 16px;
        }
        .workspace {
          margin-top: 24px;
        }
      }
      @media (forced-colors: active) {
        .desktop {
          background: Canvas !important;
        }
        main,
        .controls {
          color: CanvasText;
        }
        p,
        .eyebrow,
        .note,
        .workspace label {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="desktop" aria-hidden="true"></div>
    <main>
      <div class="eyebrow" id="eyebrow">ZenX · 前台操作提示</div>
      <h1 id="preview-heading">轻一点提示，<br />随时可以停止。</h1>
      <p id="preview-description">
        屏幕边缘的轻光效提示正在进行的电脑操作。顶部显示助手名称，保留清晰的停止入口。
      </p>
      <div class="workspace">
        <label for="workspace-input" id="workspace-label"
          >试着在这里输入。预览中的边缘光效不拦截点击。</label
        >
        <input id="workspace-input" value="你的工作区，依然由你掌控。" />
      </div>
    </main>
    <iframe
      id="edge-preview"
      title="屏幕边缘光效预览"
      sandbox="allow-same-origin"
      tabindex="-1"
      aria-hidden="true"
    ></iframe>
    <iframe
      id="status-preview"
      title="电脑操作状态预览"
      sandbox="allow-same-origin"
    ></iframe>
    <div class="controls" aria-label="预览选项">
      <label
        ><span id="language-label">语言</span>
        <select id="language">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
        </select></label
      >
      <label
        ><span id="agents-label">助手</span>
        <select id="agents">
          <option value="single">单个助手</option>
          <option value="multiple">多个助手</option>
          <option value="long">长名称</option>
        </select></label
      >
      <button id="theme" type="button">浅色背景</button>
      <button id="resume" type="button">重置预览</button>
      <div class="note" id="preview-note">
        实际组件的视觉预览，不执行电脑操作。原生窗口的焦点与点击穿透仍需另行验证。
      </div>
    </div>
    <script type="module" src="./foreground-activity-visual.ts"></script>
  </body>
</html>
